<div class="full-screen-container">
    <!-- Título de la aplicación -->
    <div class="app-title">
        <h1>MINFIN Meetings</h1>
    </div>

    <div class="content-wrapper">
        <!-- Header con icono -->
        <div class="header-section">
            <div class="status-icon">
                <span class="material-icons">person_off</span>
            </div>
            <h1 class="main-title">Usuario Ya Registrado</h1>
        </div>

        <!-- Mensaje principal -->
        <div class="message-section">
            <p class="primary-message">
                Ya te encuentras registrado en esta reunión
            </p>
            <p class="secondary-message">
                No es necesario que vuelvas a completar el formulario
            </p>
        </div>

        <!-- Indicador de estado animado -->
        <div class="status-indicator">
            <div class="warning-animation">
                <div class="warning-icon"></div>
            </div>
            <span class="status-text">Registro duplicado</span>
        </div>

        <!-- Información adicional -->
        <div class="additional-info">
            <div class="info-item">
                <span class="info-label">Estado:</span>
                <span class="info-value">Ya registrado</span>
            </div>
            <div class="info-item">
                <span class="info-label">Mensaje:</span>
                <span class="info-value">Participación confirmada</span>
            </div>
        </div>
    </div>

    <!-- Logo de la institución -->
    <div class="institution-logo">
        <img src="../../../assets/images/minfin.png" alt="Logo MINFIN" class="logo-image">
    </div>
</div>
