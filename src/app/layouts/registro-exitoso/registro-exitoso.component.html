<div class="full-screen-container">
    <!-- Título de la aplicación -->
    <div class="app-title">
        <h1>MINFIN Meetings</h1>
    </div>

    <div class="content-wrapper">
        <!-- Header con icono -->
        <div class="header-section">
            <div class="status-icon">
                <span class="material-icons">check_circle</span>
            </div>
            <h1 class="main-title">¡Registro Exitoso!</h1>
        </div>

        <!-- Mensaje principal -->
        <div class="message-section">
            <p class="primary-message">
                Tu asistencia ha sido registrada correctamente
            </p>
            <p class="secondary-message">
                Gracias por confirmar tu participación en la reunión
            </p>
        </div>

        <!-- Indicador de estado animado -->
        <div class="status-indicator">
            <div class="success-animation">
                <div class="checkmark"></div>
            </div>
            <span class="status-text">Registro completado</span>
        </div>

        <!-- Información adicional -->
        <div class="additional-info">
            <div class="info-item">
                <span class="info-label">Estado:</span>
                <span class="info-value">Confirmado</span>
            </div>
            <div class="info-item">
                <span class="info-label">Mensaje:</span>
                <span class="info-value">Asistencia registrada</span>
            </div>
        </div>
    </div>

    <!-- Logo de la institución -->
    <div class="institution-logo">
        <img src="../../../assets/images/minfin.png" alt="Logo MINFIN" class="logo-image">
    </div>
</div>
